<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedicHora</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!DOCTYPE html>

    <html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MedicHora | Seu aplicativo de saúde</title>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>

        <form id="form">
            <div class="container">
                <div class="titulo">
                    <h1>Cálculo das suas dosagens diárias</h1>
                    <h5>Preencha as seguintes informações para calcular sua dosagem</h5>
                </div>

                <div class="imagem"></div>

                <div class="dados_container">

                    <div class="nome">
                        <label for="nome">Seu nome</label>
                        <input type="text" id="nome" placeholder="Insira seu Nome" required>
                    </div>

                    <div class="email">
                        <label for="email">Seu email</label>
                        <input type="email" id="email" placeholder="Insira seu email" required>
                    </div>

                    <div class="data">
                        <label for="data">Data</label>
                        <input type="date" id="data">
                    </div>

                    <div class="botao">
                        <button type="button">Entrar</button>
                    </div>

                    <div class="medicamento">

                        <div class="nome_medicamento">
                            <label for="medicamento">Nome do medicamento</label>
                            <input type="text" id="medicamento" placeholder="Insira o nome do seu medicamento" required>
                        </div>

                        <div class="salvar_medicamento">
                            <input type="radio" name="usar_padrao" id="usar_padrao">
                            <label for="usar_padrao">Selecionar medicamento padrão</label>
                            <h5>Usar um medicamento pré-definido</h5>
                        </div>

                        <div class="dosagem" id="doses">
                            <h2>Dosagem</h2>
                            <label>Selecione a Dosagem do Medicamento</label>
                        </div>

                        <div class="quantidade_dosagem">
                            <input type="radio" name="dosagem" id="d250" value="250">
                            <label for="d250">250mg</label>

                            <input type="radio" name="dosagem" id="d500" value="500">
                            <label for="d500">500mg</label>

                            <input type="radio" name="dosagem" id="d750" value="750">
                            <label for="d750">750mg</label>
                        </div>

                        <div class="quantidade">
                            <button type="button" class="menos">-</button>
                            <input type="text" id="qtd_doses" placeholder="Insira a quantidade diária">
                            <button type="button" class="mais">+</button>
                        </div>
                    </div>

                    <div class="calculo">
                        <h2>Calcular dosagem diária</h2>
                    </div>

                    <div class="container_resultado">
                        <div class="check_img"></div>

                        <div class="resultado">
                            <h4>Resultado</h4>
                            <p>Você tomará 1.000 mg por dia</p>
                            <h6>Baseado em 500mg por dose, 2 vezes ao dia</h6>
                        </div>
                    </div>
                </div>
            </div>
        </form>

        <button onclick="" id="reset">Limpar formulario</button>

        <script src="javascript/logic.js"></script>
        <script src="javascript/app.js"></script>


    </body>

    </html>


    <script src="javascript/logic.js"></script>
    <script src="javascript/app.js"></script>
</body>

</html>
